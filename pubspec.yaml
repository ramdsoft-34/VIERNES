name: viernes
description: "Viernes — asistente personal de recordatorios por voz que hace seguimiento hasta que confirmas cada tarea."
publish_to: 'none'

version: 0.11.0+12

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.3.0
  cloud_firestore: ^6.10.0
  cupertino_icons: ^1.0.8
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_storage: ^13.6.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  flutter_tts: ^4.2.5
  go_router: ^18.0.2
  google_sign_in: ^7.2.0
  home_widget: ^0.10.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  just_audio: ^0.10.6
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^7.1.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  speech_to_text: ^7.5.0
  table_calendar: ^3.2.1
  timezone: ^0.11.1
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Intérprete neuronal propio (entrenado con training/nlu).
    - assets/ai/nlu_model.json

  # Geist y Geist Mono (Vercel, licencia OFL: assets/fonts/OFL.txt).
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Light.ttf
          weight: 300
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
