include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "lib/l10n/gen/**"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    # La API pública es interna a la app; documentamos lo que aporta contexto.
    public_member_api_docs: false
    # Las interfaces de un solo método (Clock, IdGenerator…) son puntos de
    # inyección para pruebas, no funciones disfrazadas.
    one_member_abstracts: false
